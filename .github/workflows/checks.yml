name: checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x86_64
          - os: windows-latest
            architecture: x86_64
          - os: macos-15
            architecture: arm64
          - os: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev --python 3.12
      - name: Verify native Python architecture
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: uv run python -c "import os, platform; actual = platform.machine().lower().replace('amd64', 'x86_64'); print(platform.platform(), actual); assert actual == os.environ['EXPECTED_ARCH'], actual"
      - run: uv run pytest -q
      - run: uv run ruff check src tests
      - name: Offline CLI with a data path containing spaces
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          from decimal import Decimal
          import os
          import subprocess
          import sys
          import tempfile

          env = {
              key: value for key, value in os.environ.items()
              if not key.startswith(("PORTFOLIO_", "LANGCHAIN_", "LANGSMITH_"))
              and key not in {"OPENAI_API_KEY", "ANTHROPIC_API_KEY", "LITELLM_API_KEY"}
          }
          with tempfile.TemporaryDirectory(prefix="Betafolio smoke ") as directory:
              result = subprocess.run(
                  [sys.executable, "-m", "betafolio", "--data-dir", directory,
                   "analyze", "--demo", "--offline"],
                  capture_output=True, text=True, timeout=60, env=env,
              )
              assert result.returncode == 0, result.stderr
              report = json.loads(result.stdout)
              assert report["status"] == "success", report["status"]
              assert Decimal(report["metrics"]["known_value"]) == 42890
          PY
  production-boundaries:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: betafolio
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: betafolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betafolio -d betafolio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BETAFOLIO_TEST_DATABASE_URL: postgresql+psycopg://betafolio:disposable-ci-password@127.0.0.1:5432/betafolio_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev --python 3.12
      - run: uv run pytest tests/test_production.py -q
