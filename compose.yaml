name: betafolio
x-app: &app
  image: betafolio:local
  build: .
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - app-data:/data
  environment: &environment
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-betafolio}:${POSTGRES_PASSWORD:?Run scripts/configure.py first}@db:5432/${POSTGRES_DB:-betafolio}
    BETAFOLIO_ENCRYPTION_KEY: ${BETAFOLIO_ENCRYPTION_KEY:?Run scripts/configure.py first}
    PORTFOLIO_SERVER_MODE: "0"
    BETAFOLIO_CONTAINER_LOCAL: "1"
    PORTFOLIO_PUBLIC_URL: ${PORTFOLIO_PUBLIC_URL:-http://127.0.0.1:8000}
    HOME: /tmp
    XDG_CACHE_HOME: /tmp/cache
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betafolio}
      POSTGRES_DB: ${POSTGRES_DB:-betafolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 -c "SELECT 1" > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *environment
      BETAFOLIO_BOOTSTRAP_ADMIN_EMAIL: ${BETAFOLIO_BOOTSTRAP_ADMIN_EMAIL:?Run scripts/configure.py first}
      BETAFOLIO_BOOTSTRAP_ADMIN_PASSWORD: ${BETAFOLIO_BOOTSTRAP_ADMIN_PASSWORD:?Run scripts/configure.py first}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
  worker:
    <<: *app
    command: [/app/.venv/bin/betafolio, worker]
    depends_on:
      web:
        condition: service_healthy
volumes:
  postgres-data:
  app-data:
